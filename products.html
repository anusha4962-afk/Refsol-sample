document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

pect-ratio:4/3;overflow:hidden;background:#e4e0d8\">\n                <image-slot id=\"{{ p.slotId }}\" shape=\"rect\" src=\"{{ p.img }}\" placeholder=\"product photo\" style=\"width:100%;height:100%\"><\u002Fimage-slot>\n              <\u002Fdiv>\n              <div style=\"padding:16px 18px 20px;text-align:left\">\n                <div style=\"font-size:15.5px;font-weight:500;color:#111111;line-height:1.3;font-family:Tektur, sans-serif\">{{ p.name }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#8a6a1f;margin-top:6px;letter-spacing:0.02em\">{{ p.tag }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <div style=\"position:sticky;top:24px;height:calc(100vh - 48px);width:{{ panelWidth }};overflow:hidden;flex:0 0 auto;isolation:isolate;transition:width 380ms cubic-bezier(0.22,1,0.36,1)\">\n      <sc-if value=\"{{ selected }}\" hint-placeholder-val=\"{{ false }}\">\n        <sc-if value=\"{{ isDesktop }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"width:calc(100% - 24px);height:100%;overflow-y:auto;margin-right:24px;border-radius:22px;background:#161616;box-shadow:0 10px 30px rgba(0,0,0,0.16);padding:36px 34px 50px;box-sizing:border-box;position:relative\">\n          <button sc-camel-on-click=\"{{ closePanel }}\" style=\"all:unset;cursor:pointer;position:absolute;top:20px;right:20px;z-index:2;display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,0.45);backdrop-filter:blur(6px);color:#ffffff;font-size:16px\" style-hover=\"background:rgba(0,0,0,0.65)\">✕<\u002Fbutton>\n          <div style=\"aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#222\">\n            <image-slot id=\"{{ selected.slotIdLarge }}\" shape=\"rect\" fit=\"contain\" src=\"{{ selected.img }}\" placeholder=\"product photo\" style=\"width:100%;height:100%\" <=\"\" image-slot=\"\">\n aw-thead>\n                    <sc-if value=\"{{ selected.specTable.groupHeader }}\" hint-placeholder-val=\"{{ false }}\">\n                      <sc-raw-tr>\n                        <sc-raw-td style=\"padding:7px 10px 7px 0;border-bottom:1px solid rgba(255,255,255,0.08)\"><\u002Fsc-raw-td>\n                        <sc-raw-th colspan=\"{{ selected.colCount }}\" style=\"text-align:left;padding:7px 10px;border-bottom:1px solid rgba(255,255,255,0.08);color:#9c948a;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;font-size:11px\">{{ selected.specTable.groupHeader }}<\u002Fsc-raw-th>\n                      <\u002Fsc-raw-tr>\n                    <\u002Fsc-if>\n                    <sc-raw-tr>\n                      <sc-raw-th style=\"text-align:left;padding:7px 10px 7px 0;border-bottom:1px solid rgba(255,255,255,0.15);color:#9c948a;font-weight:500\">Specifications<\u002Fsc-raw-th>\n                      <sc-for list=\"{{ selected.specTable.columns }}\" as=\"col\" hint-placeholder-count=\"3\">\n                        <sc-raw-th style=\"text-align:left;padding:7px 10px;border-bottom:1px solid rgba(255,255,255,0.15);color:#EDEAE4;font-weight:500\">{{ col }}<\u002Fsc-raw-th>\n                      <\u002Fsc-for>\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-raw-thead>\n                  <sc-raw-tbody>\n                    <sc-for list=\"{{ selected.specTable.rows }}\" as=\"row\" hint-placeholder-count=\"6\">\n                      <sc-raw-tr>\n                        <sc-raw-td style=\"padding:7px 10px 7px 0;border-bottom:1px solid rgba(255,255,255,0.08);color:#9c948a;font-weight:500\">{{ row.label }}<\u002Fsc-raw-td>\n                        <sc-for list=\"{{ row.values }}\" as=\"v\" hint-placeholder-count=\"3\">\n                          <sc-raw-td style=\"padding:7px 10px;border-bottom:1px solid rgba(255,255,255,0.08);color:#e3ddd0;white-space:normal\">{{ v }}<\u002Fsc-raw-td>\n                        <\u002Fsc-for>\n                      <\u002Fsc-raw-tr>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-tbody>\n                <\u002Fsc-raw-table>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ selected.noTable }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"font-size:14px;line-height:1.6;color:#e3ddd0\">{{ selected.specs }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showMobilePanel }}\" hint-placeholder-val=\"{{ false }}\">\n      <div sc-camel-on-click=\"{{ closePanel }}\" style=\"position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:90\"><\u002Fdiv>\n      <div style=\"position:fixed;top:0;right:0;height:100vh;width:85vw;z-index:95;background:#161616;box-shadow:-10px 0 30px rgba(0,0,0,0.2);display:flex;flex-direction:column\">\n        <div style=\"flex:1 1 auto;overflow-y:auto;padding:28px 24px 20px;box-sizing:border-box;position:relative\">\n          <button sc-camel-on-click=\"{{ closePanel }}\" style=\"all:unset;cursor:pointer;position:absolute;top:18px;right:18px;z-index:2;display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,0.45);backdrop-filter:blur(6px);color:#ffffff;font-size:16px\">✕<\u002Fbutton>\n          <div style=\"aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#222\">\n            <image-slot id=\"{{ selected.slotIdLargeM }}\" shape=\"rect\" fit=\"contain\" src=\"{{ selected.img }}\" placeholder=\"product photo\" style=\"width:100%;height:100%\" <=\"\" image-slot=\"\">\n          <\u002Fimage-slot><\u002Fdiv>\n          <sc-if value=\"{{ selected.hasExtraImages }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fill, minmax(80px, 1fr));gap:8px;margin-top:8px\">\n              <sc-for list=\"{{ selected.galleryImages }}\" as=\"gimgm\" hint-placeholder-count=\"2\">\n                <div style=\"aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:#222\">\n                  <image-slot id=\"{{ gimgm.id }}m\" shape=\"rect\" fit=\"contain\" src=\"{{ gimgm.src }}\" placeholder=\"product photo\" style=\"width:100%;height:100%\"><\u002Fimage-slot>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#9c948a;font-family:ui-monospace, SFMono-Regular, Menlo, monospace;margin-top:22px\">{{ selected.tag }}<\u002Fdiv>\n          <h2 style=\"font-family:Tektur, sans-serif;font-size:22px;font-weight:500;line-height:1.25;color:#EDEAE4;margin:8px 0 0;text-wrap:pretty\">{{ selected.name }}<\u002Fh2>\n          <sc-for list=\"{{ selected.paragraphs }}\" as=\"para2\" hint-placeholder-count=\"1\">\n            <p style=\"font-size:14px;line-height:1.65;color:#a39d92;font-weight:400;margin:16px 0 0;text-wrap:pretty\">{{ para2 }}<\u002Fp>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ selected.noTable }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.1);font-size:13.5px;line-height:1.6;color:#e3ddd0\">{{ selected.specs }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"flex:0 0 auto;display:flex;border-top:1px solid rgba(255,255,255,0.1)\">\n          <button sc-camel-on-click=\"{{ prevProduct }}\" style=\"all:unset;cursor:pointer;flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:16px 0;color:#EDEAE4;font-size:14px\" style-hover=\"background:rgba(255,255,255,0.05)\">← Previous<\u002Fbutton>\n          <div style=\"width:1px;background:rgba(255,255,255,0.1)\"><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ nextProduct }}\" style=\"all:unset;cursor:pointer;flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:16px 0;color:#EDEAE4;font-size:14px\" style-hover=\"background:rgba(255,255,255,0.05)\">Next →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst PRODUCTS = [\n  { name: 'Brown Fused Alumina (BFA)', tag: 'Al₂O₃ · Abrasive & Refractory Grade', img: 'https://www.refsol.in/images/Product%201.1.jpg',\n    description: 'Brown Fused Alumina (BFA) is produced by a reduction fusion of high quality bauxites in electric arc furnaces. It is widely used as a raw material in refractories, ceramic shapes, grinding wheels, sandpaper, blasting media, metal preparation, laminates, coatings, lapping and grinding. Brown fused aluminum oxide is a tough, hard material (Mohs hardness 9) with high strength, excellent wear and corrosion resistance and good thermal conductivity. Brown Fused Alumina Refractory Grades is a mineral with fine particle distribution for shaped and unshaped refractory products in fire-proof, precision casting, foundry and coating industries.\\n\\nDivided by the furnace used during fusion, Brown Fused Alumina can be divided into Fixed Furnace and Tilting Furnace. Tilting Furnace BFA has higher Aluminium Oxide (Al₂O₃) content and strength, lower impurities. Tilting Furnace BFA can be identified by content of Silicon Oxide (SiO₂), with 1% max SiO₂, while Fixed Furnace usually has 1.5% max.',\n    images: ['https://www.refsol.in/images/Product%201.1.jpg', 'https://www.refsol.in/images/Product%201.2.jpg'],\n    specTable: {\n      groupHeader: 'Material',\n      columns: ['Fixed Furnace', 'Tilting Furnace', 'Abrasive Grade'],\n      rows: [\n        { label: 'Al₂O₃', values: ['94.5% min', '95–95.3% min', '95–95.5% min'] },\n        { label: 'Fe₂O₃', values: ['0.3% max', '0.3% max', '0.3% max'] },\n        { label: 'SiO₂', values: ['1.5% max', '1.0% max', '1.0% max'] },\n        { label: 'TiO₂', values: ['3.0% max', '3.0% max', '3.0% max'] },\n        { label: 'B.D.', values: ['3.80 g/cc min', '3.80 g/cc min', '3.80 g/cc min'] },\n        { label: 'Size', values: ['8/16, 16/30, 30/60, 60/140 mesh & other grits', '8/16, 16/30, 30/60, 60/140 mesh & other grits', '46/80, 80/150 mesh, FEPA sizes'] }\n      ]\n    },\n    specs: 'Al₂O₃ 95–95.3% min · Fe₂O₃ 0.3% max · SiO₂ 1.0% max · TiO₂ 3.0% max · B.D. 3.80 g/cc min' },\n  { name: 'White Fused Alumina (WFA)', tag: 'High-Purity α-Alumina', img: 'https://www.refsol.in/images/Product%202.1.jpg',\n    description: 'Produced by fusing calcined alumina in an electric arc furnace under controlled conditions. Dense, white, with predominantly large Alpha Alumina crystals — high hardness, high purity, chemical stability and a high melting point.',\n    specs: 'Chinese-origin grade · High-purity α-Al₂O₃ · Large crystal size' },\n  { name: 'Tabular Alumina (WTA)', tag: 'Sintered Corundum', img: 'https://www.refsol.in/images/Product%203.1.jpg',\n    description: 'A synthetic corundum produced by pre-firing calcined alumina at very high temperature until fully densified, near theoretical density. Prized in refractories that demand high thermal-shock and corrosion resistance.',\n    specs: 'Near-theoretical density · Low porosity · High-purity Al₂O₃' },\n  { name: 'Rotary Kiln Calcined Bauxite (RKCB)', tag: 'Al₂O₃ · Refractory Grade', img: 'https://www.refsol.in/images/Product%204.1.jpg',\n    description: 'Bauxite calcined in a rotary kiln, producing a more evenly fired material than shaft or round kiln processes thanks to continuous rotary movement. The essential raw material for high-quality refractory products such as corundum brick.',\n    specs: 'RKCB 80 grade — Al₂O₃ 80% min · Fe₂O₃ 2.0% max · SiO₂ 14% max · B.D. 3.00 g/cc min' },\n  { name: 'Fused Magnesite (FM)', tag: 'Fused MgO', img: 'https://www.refsol.in/images/Product%205.1.jpg',\n    description: 'Magnesium oxide (periclase) produced by electric-arc fusion of magnesite or caustic magnesia, prized for large crystal size and low porosity. A key raw material for basic refractories.',\n    specs: 'High-purity fused MgO · Large periclase crystal size' },\n  { name: 'Dead Burnt Magnesite (DBM)', tag: 'Sintered MgO', img: 'https://www.refsol.in/images/Product%206.1.jpg',\n    description: 'Magnesite calcined at very high temperature (typically above 1600°C) to a dense, chemically inert MgO product — the primary raw material for basic refractory bricks and monolithics.',\n    specs: 'High-density sintered MgO · Calcined above 1600°C' },\n  { name: 'Calcined Magnesia (CCM)', tag: 'Caustic Calcined MgO', img: 'https://www.refsol.in/images/Product%207.1.jpg',\n    description: 'Magnesium oxide produced by calcining magnesite at moderate-to-high temperature — a lighter, more reactive grade than dead-burnt or fused magnesia, used across refractory and industrial applications.',\n    specs: 'Caustic-calcined MgO grade' },\n  { name: 'Silicon Carbide (SiC)', tag: 'Abrasive & Refractory Grade', img: 'https://www.refsol.in/images/Product%208.1.jpg',\n    description: 'Synthesized in a resistance-type electric furnace above 2500°C through the reaction of silica with carbon. Extreme hardness, sharpness and good thermal properties make it valuable as both an abrasive and refractory material.',\n    specs: 'SiC 97% min · Fe₂O₃ 0.5% max · Free C 0.5% max · Magnetic iron 0.15% max' },\n  { name: 'Boron Carbide (B4C)', tag: 'Ultra-Hard Ceramic', img: 'https://www.refsol.in/images/Product%209.1.jpg',\n    description: 'One of the hardest ceramic materials known, used as an abrasive and in wear-resistant and neutron-absorbing applications.',\n    specs: 'Mohs hardness ~9.3 · Ultra-hard boron ceramic' },\n  { name: 'Si Metal Powder', tag: 'Metallurgical Grade', img: 'https://www.refsol.in/images/Product%2010.1.jpg',\n    description: 'High-purity metallic silicon powder used in metallurgical, chemical and refractory applications, including as an additive in castables and refractory mixes.',\n    specs: 'High-purity metallic silicon powder' },\n  { name: 'Fused Almag Spinel', tag: 'MgAl₂O₄ Spinel', img: 'https://www.refsol.in/images/Product%2011.1.jpg',\n    description: 'A fused magnesium aluminate spinel offering excellent volume stability and slag resistance — used in monolithic refractories for steel ladles and cement kilns.',\n    specs: 'MgAl₂O₄ · High slag & volume stability' },\n  { name: 'Fused Silica', tag: 'Amorphous SiO₂', img: 'https://www.refsol.in/images/Product%2012.1.jpg',\n    description: 'Amorphous silicon dioxide produced by fusing quartz, valued for very low thermal expansion and excellent thermal-shock resistance in precision casting and refractory applications.',\n    specs: 'Amorphous SiO₂ · Very low thermal expansion' },\n  { name: 'Natural Flake Graphite', tag: 'High-Carbon Flake', img: 'https://www.refsol.in/images/Product%2013.1.jpg',\n    description: 'Naturally occurring crystalline carbon with high thermal conductivity and lubricity, used in refractories such as MgO-C bricks, foundry facings and lubricants.',\n    specs: 'High-carbon natural flake graphite' }\n];\n\nclass Component extends DCLogic {\n  state = { selectedIndex: null, isMobile: false };\n\n  componentDidMount() {\n    this.onResize = () => this.setState({ isMobile: window.innerWidth <= 768 });\n    this.onResize();\n    window.addEventListener('resize', this.onResize);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('resize', this.onResize);\n  }\n\n  select(i) { this.setState({ selectedIndex: i }); }\n  close() { this.setState({ selectedIndex: null }); }\n  next() { this.setState(s => ({ selectedIndex: s.selectedIndex === null ? null : (s.selectedIndex + 1) % PRODUCTS.length })); }\n  prev() { this.setState(s => ({ selectedIndex: s.selectedIndex === null ? null : (s.selectedIndex - 1 + PRODUCTS.length) % PRODUCTS.length })); }\n\n  renderVals() {\n    const sel = this.state.selectedIndex;\n    const isMobile = this.state.isMobile;\n    const products = PRODUCTS.map((p, i) => ({\n      ...p,\n      slotId: 'refsol-prod-' + i,\n      borderColor: sel === i ? '#8a6a1f' : 'transparent',\n      cardTransform: sel === i ? 'translateY(-2px)' : 'none',\n      select: () => this.select(i)\n    }));\n    const selected = sel === null ? false : {\n      ...PRODUCTS[sel],\n      slotIdLarge: 'refsol-prod-large-' + sel,\n      slotIdLargeM: 'refsol-prod-large-m-' + sel,\n      hasTable: !!PRODUCTS[sel].specTable,\n      noTable: !PRODUCTS[sel].specTable,\n      paragraphs: PRODUCTS[sel].description.split('\\n\\n'),\n      galleryImages: (PRODUCTS[sel].images || []).map((src, gi) => ({ src, id: 'refsol-prod-gal-' + sel + '-' + gi })),\n      hasExtraImages: !!(PRODUCTS[sel].images && PRODUCTS[sel].images.length),\n      colCount: PRODUCTS[sel].specTable ? PRODUCTS[sel].specTable.columns.length : 0\n    };\n    return {\n      products,\n      selected,\n      closePanel: () => this.close(),\n      nextProduct: () => this.next(),\n      prevProduct: () => this.prev(),\n      isMobile,\n      isDesktop: !isMobile,\n      showMobilePanel: isMobile && sel !== null,\n      panelWidth: (!isMobile && sel !== null) ? '40vw' : '0px',\n      marginRight: 0\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
